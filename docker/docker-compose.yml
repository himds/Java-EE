version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: water-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: waterdb
      MYSQL_USER: wateruser
      MYSQL_PASSWORD: waterpass
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ../database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro

  tomcat:
    image: tomcat:11.0
    container_name: water-tomcat
    ports:
      - "8080:8080"
    volumes:
      - ../backend/target:/usr/local/tomcat/webapps
    depends_on:
      - mysql

volumes:
  mysql-data:
