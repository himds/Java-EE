services:
  mysql:
    image: mysql:8.0
    container_name: water-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: waterdb
      MYSQL_USER: wateruser
      MYSQL_PASSWORD: waterpass
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ../database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  tomcat:
    image: tomcat:11.0
    container_name: water-tomcat
    ports:
      - "8082:8080"
    environment:
      DB_URL: "jdbc:mysql://mysql:3306/waterdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8"
      DB_USER: wateruser
      DB_PASSWORD: waterpass
    volumes:
      - ../backend/target/water-quality.war:/usr/local/tomcat/webapps/water-quality.war
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql-data:
