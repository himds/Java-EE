<!DOCTYPE html>
<html>
<head>
    <title>水质数据API测试</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .success { color: green; }
        .error { color: red; }
        .test { margin: 20px 0; padding: 10px; border: 1px solid #ccc; }
    </style>
</head>
<body>
    <h1>水质数据API测试页面</h1>
    <p>如果看到此页面，说明应用已部署成功。</p>
    
    <div class="test">
        <h3>API端点测试：</h3>
        <ul>
            <li><a href="/water-quality/api/communes">/api/communes</a> - 所有市镇数据</li>
            <li><a href="/water-quality/api/map-data">/api/map-data</a> - 地图数据</li>
            <li><a href="/water-quality/api/communes/01001">/api/communes/01001</a> - 特定市镇数据</li>
        </ul>
    </div>
    
    <div class="test">
        <h3>数据库连接测试：</h3>
        <button onclick="testDatabase()">测试数据库连接</button>
        <div id="db-result"></div>
    </div>
    
    <script>
        async function testDatabase() {
            const resultDiv = document.getElementById('db-result');
            resultDiv.innerHTML = '测试中...';
            
            try {
                const response = await fetch('/water-quality/api/communes');
                if (response.ok) {
                    const data = await response.json();
                    resultDiv.innerHTML = `<span class="success">✅ 数据库连接成功！返回 ${data.length} 条记录</span>`;
                } else {
                    resultDiv.innerHTML = `<span class="error">❌ API错误: ${response.status} ${response.statusText}</span>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<span class="error">❌ 连接错误: ${error.message}</span>`;
            }
        }
    </script>
</body>
</html>
